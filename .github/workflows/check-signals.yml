name: Check BTC signals

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Enviar un mensaje de prueba a Telegram'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: btc-signals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MIN_GRADE: 'B'
          TEST_MESSAGE: ${{ inputs.test }}
        run: node signal-check.js

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain signal-state.json)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add signal-state.json
            git commit -m "update signal state"
            git pull --rebase
            git push
          fi
